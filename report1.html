<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REPORT — BEYLOG</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --red:    #E5001A;
      --navy:   #0B0E2D;
      --gold:   #F5C400;
      --white:  #F2EFE6;
      --card:   #121533;
      --muted:  rgba(242,239,230,0.4);
      --border: rgba(245,196,0,0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--navy);
      color: var(--white);
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100vh;
    }

    .bg-beys { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .bg-bey   { position: absolute; border-radius: 50%; opacity: 0.04; animation: spin linear infinite; }
    .bg-bey:nth-child(1) { width: 500px; height: 500px; top: -100px; right: -80px; border: 24px solid var(--red);  animation-duration: 18s; }
    .bg-bey:nth-child(2) { width: 320px; height: 320px; bottom: 5%; left: -80px;  border: 16px solid var(--gold); animation-duration: 12s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }

    header {
      position: relative; z-index: 10;
      padding: 20px 30px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center;
    }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 5px; color: var(--white); text-shadow: 2px 2px 0 var(--red); text-decoration: none; }
    nav { display: flex; gap: 24px; margin-top: 10px; }
    nav a { color: var(--muted); text-decoration: none; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; transition: color 0.2s; }
    nav a:hover, nav a.active { color: var(--gold); }

    .page-title { position: relative; z-index: 5; text-align: center; padding: 40px 20px 28px; }
    .page-title h1 { font-family: 'Bebas Neue', sans-serif; font-size: 48px; letter-spacing: 8px; }
    .page-title p  { font-size: 12px; letter-spacing: 3px; color: var(--muted); margin-top: 6px; }

    .container { position: relative; z-index: 5; max-width: 640px; margin: 0 auto; padding: 0 24px 80px; }

    .series-list { display: flex; flex-direction: column; gap: 14px; }

    .series {
      display: flex;
      align-items: center;
      gap: 18px;
      text-decoration: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--red);
      border-radius: 6px;
      padding: 20px 22px;
      transition: border-color 0.2s, transform 0.2s;
      animation: fadeUp 0.5s ease both;
    }
    .series:nth-child(1) { animation-delay: 0.05s; }
    .series:nth-child(2) { animation-delay: 0.12s; }
    .series:nth-child(3) { animation-delay: 0.19s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .series:hover { border-color: rgba(245,196,0,0.5); border-left-color: var(--red); transform: translateX(4px); }

    .series-no {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 34px;
      color: var(--gold);
      line-height: 1;
      flex-shrink: 0;
      min-width: 36px;
    }
    .series-text { flex: 1; min-width: 0; }
    .series-title { display: block; font-size: 16px; font-weight: 700; color: var(--white); margin-bottom: 4px; }
    .series-sub   { display: block; font-size: 12px; color: var(--muted); }
    .series-arrow { font-size: 22px; color: var(--gold); opacity: 0.4; transition: opacity 0.2s, transform 0.2s; }
    .series:hover .series-arrow { opacity: 1; transform: translateX(4px); }

    .back { display: inline-block; margin-top: 28px; font-size: 12px; letter-spacing: 2px; color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .back:hover { color: var(--gold); }

    footer {
      position: relative; z-index: 5;
      text-align: center;
      padding: 24px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: rgba(242,239,230,0.25);
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

<div class="bg-beys" aria-hidden="true">
  <div class="bg-bey"></div>
  <div class="bg-bey"></div>
</div>

<header>
  <a href="index.html" class="logo">BEYLOG</a>
  <nav>
    <a href="index.html">HOME</a>
    <a href="blog.html">BLOG</a>
    <a href="gallery.html" class="active">GALLERY</a>
    <a href="about.html">ABOUT</a>
  </nav>
</header>

<div class="page-title">
  <h1>REPORT</h1>
  <p>アニメ1話ずつの感想</p>
</div>

<div class="container">
  <div class="series-list">

    <a href="report1-1.html" class="series">
      <span class="series-no">01</span>
      <div class="series-text">
        <span class="series-title">爆転シュートベイブレード</span>
        <span class="series-sub">初代 / 全51話</span>
      </div>
      <span class="series-arrow">›</span>
    </a>

    <a href="report1-2.html" class="series">
      <span class="series-no">02</span>
      <div class="series-text">
        <span class="series-title">爆転シュートベイブレード2002</span>
        <span class="series-sub">第2シリーズ</span>
      </div>
      <span class="series-arrow">›</span>
    </a>

    <a href="report3.html" class="series">
      <span class="series-no">03</span>
      <div class="series-text">
        <span class="series-title">爆転シュートベイブレード Gレボリューション</span>
        <span class="series-sub">第3シリーズ</span>
      </div>
      <span class="series-arrow">›</span>
    </a>

  </div>

  <a href="gallery.html" class="back">← GALLERYに戻る</a>
</div>

<footer>BEYLOG — 非公式ファンサイト</footer>

</body>
</html>
